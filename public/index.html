<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>GitHub Config Hub · 配置管理</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/js/boot.js"></script>
  <!-- highlight.js 11.10.0（本地文件，避免 CDN 加载失败） -->
  <link rel="stylesheet" href="/highlight-github.css" />
  <script src="/highlight.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <dialog id="modal" class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button id="modalClose" class="btn ghost" type="button">✕</button></div><div id="modalBody" class="modal-body"></div></dialog>
  <dialog id="reauth" class="modal reauth"><form id="reauthForm" method="dialog"><div class="modal-head"><h3>登录已失效</h3></div><div class="modal-body"><p class="muted small-text">管理口令已失效或被更换。你的编辑内容仍保留在页面中，重新输入口令即可继续，无需刷新。</p><input id="reauthInput" type="password" placeholder="管理口令" autocomplete="off" class="vp-filter" required /><div class="reauth-actions"><button id="reauthLogout" type="button" class="btn ghost">退出登录</button><button id="reauthSubmit" type="submit" class="btn primary">继续</button></div></div></form></dialog>
  <div id="dropHint">松开鼠标，上传文件到仓库</div>
  <div id="splash" aria-live="polite"><div class="splash-box"><span class="spinner"></span><span>正在连接…</span></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <section id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">{ }</div>
      <p class="overline">GitHub Config Hub</p>
      <h1>配置文件管理中心</h1>
      <form id="loginForm">
        <label for="tokenInput">管理口令</label>
        <input id="tokenInput" type="password" placeholder="请输入管理口令" required autocomplete="off" />
        <label class="check-line"><input id="rememberInput" type="checkbox" /> 在本浏览器内保持登录</label>
        <button id="loginButton" class="btn primary full" type="submit">进入管理中心</button>
      </form>
    </div>
  </section>

  <div id="appView" class="app" hidden>
    <header class="topbar">
      <div class="brand"><div class="brand-mark small">{ }</div><div><strong>Github Config Hub</strong><small>配置文件管理中心</small></div></div>
      <div class="top-actions"><span id="repoBadge" class="repo-badge">—</span><span id="roleBadge" class="role-badge" hidden></span><button class="btn ghost" id="searchBtn">搜索/替换</button><button class="btn ghost" id="refreshBtn">⟳ 刷新</button><div class="menu"><button class="btn ghost menu-btn" type="button" aria-haspopup="menu" aria-expanded="false">更多 ▾</button><div class="menu-list" role="menu" hidden><button class="btn ghost small menu-item" id="activityBtn" type="button" role="menuitem">操作记录</button><button class="btn ghost small menu-item" id="backupBtn" type="button" role="menuitem">导出 / 导入</button><button class="btn ghost small menu-item" id="parseBtn" type="button" role="menuitem">链接解析</button><button class="btn ghost small menu-item" id="accessRulesBtn" type="button" role="menuitem">文件访问规则</button><button class="btn ghost small menu-item danger" id="logoutBtn" type="button" role="menuitem">退出登录</button></div></div></div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="side-heading"><div><p class="overline">REPOSITORY</p><h2 id="repoName">—</h2><p id="branchLabel" class="muted small-text">—</p></div><button id="switchBtn" class="btn ghost small" title="切换分支">⎇ 分支</button></div>
        <div class="side-actions"><button id="newBtn" class="btn primary write-only">＋ 新建文件</button><button id="uploadBtn" class="btn secondary write-only">↑ 上传</button><input id="uploadInput" type="file" multiple hidden /></div>
        <label for="searchInput" class="visually-hidden">搜索文件</label>
        <input id="searchInput" class="search" placeholder="⌕ 搜索文件或目录..." />
        <div class="list-header"><span>仓库文件</span><span id="fileCount">0 个文件</span></div>
        <nav id="fileList" class="file-list" aria-label="仓库文件"></nav>
        <div class="sidebar-note"><span class="dot"></span><span id="repoVisibility">正在检查仓库...</span></div>
      </aside>
      <main class="main-panel">
        <section id="emptyState" class="empty-state"><div class="empty-icon">⌁</div><h2>选择文件开始编辑</h2><p>从左侧浏览，或新建一个配置文件。</p></section>
        <section id="editorPanel" class="editor-panel" hidden>
          <div class="editor-top"><div class="editor-title"><p class="overline">当前文件</p><h2 id="currentPath">—</h2><div class="meta-row"><span id="sizeLabel">—</span><span id="shaLabel">—</span><span id="dirtyLabel" class="dirty" hidden>● 未保存</span></div></div><div class="editor-actions"><button id="diffBtn" class="btn secondary" type="button">对比修改</button><button id="saveBtn" class="write-only btn primary" type="button">保存</button><button id="linksBtn" class="btn secondary" type="button" title="复制直链，或生成带令牌的分享链接">🔗 获取文件链接</button><div class="menu"><button class="btn secondary menu-btn" type="button" aria-haspopup="menu" aria-expanded="false">更多 ▾</button><div class="menu-list" role="menu" hidden><button id="historyBtn" class="btn ghost small menu-item" type="button" role="menuitem">提交历史</button><button id="accessBtn" class="btn ghost small menu-item" type="button" role="menuitem">访问设置</button><button id="downloadBtn" class="btn ghost small menu-item" type="button" role="menuitem">下载</button><button id="renameBtn" class="write-only btn ghost small menu-item" type="button" role="menuitem">重命名</button><button id="duplicateBtn" class="write-only btn ghost small menu-item" type="button" role="menuitem">复制为新文件</button><button id="deleteBtn" class="write-only btn ghost small menu-item danger" type="button" role="menuitem">删除文件</button></div></div></div></div>
          <div class="editor-box">
            <div class="editor-strip">
              <div class="editor-modes">
                <button class="mode-btn" data-mode="visual" type="button" hidden>可视化</button>
                <button class="mode-btn active" data-mode="highlight" type="button">原始内容</button>
                <button class="mode-btn" data-mode="preview" type="button" hidden>预览</button>
              </div>
              <div id="visualBar" class="visual-bar"></div>
              <span class="strip-tools"><span id="lintLabel" class="lint-label" hidden></span><button id="formatBtn" class="btn tiny write-only" type="button" hidden title="格式化 JSON（缩进 2）">格式化</button><button id="minifyBtn" class="btn tiny write-only" type="button" hidden title="压缩 JSON 为单行">压缩</button><button id="convertDataBtn" class="btn tiny write-only" type="button" hidden>转换…</button></span>
            </div>
            <div id="rawEditor" class="raw-editor">
              <div id="highlightBar" class="highlight-bar"></div>
              <div id="codeWrap" class="code-wrap">
                <pre class="code-hl" aria-hidden="true"><code id="highlightCode"></code></pre>
                <textarea id="editor" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" placeholder="在此输入配置内容..."></textarea>
              </div>
            </div>
            <div id="binaryNotice" class="binary-notice" hidden>二进制内容不能在线编辑，请下载后修改再上传。</div>
            <!-- 可视化面板容器，由 app.js 动态填充 -->
            <div id="visualPanel" class="visual-panel" hidden></div>
            <div id="previewPanel" class="preview-panel" hidden></div>
            <div class="editor-foot"><span id="encodingLabel">UTF-8</span></div>
          </div>
          
        </section>
      </main>
    </div>
  </div>
</body>
</html>
