<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>GitHub Config Hub · 配置管理</title>
  <script src="/boot.js"></script>
  <style>
    #splash { display: none; position: fixed; inset: 0; z-index: 80; align-items: center; justify-content: center; background: #f5f7fb; color: #19233b; font: 14px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; }
    html.has-token:not(.ready) #splash { display: flex; }
    html.has-token:not(.ready) #app { visibility: hidden; }
    html.has-token #loginView { display: none; }
    .splash-box { display: flex; gap: 10px; align-items: center; }
    .spinner { width: 16px; height: 16px; border: 2px solid #d5dbe8; border-top-color: #6b72ef; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite"><div class="splash-box"><span class="spinner"></span><span>正在连接…</span></div></div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
